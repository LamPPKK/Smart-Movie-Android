name: Android release AAB

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    name: Signed mobile and TV bundle
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/smartmovie-release.jks"
      - name: Build signed AAB
        env:
          SMARTMOVIE_KEYSTORE_PATH: ${{ runner.temp }}/smartmovie-release.jks
          SMARTMOVIE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SMARTMOVIE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SMARTMOVIE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --dependency-verification=strict :app:bundleRelease
      - name: Upload AAB
        uses: actions/upload-artifact@v7
        with:
          name: smartmovie-2.0.0-aab
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
