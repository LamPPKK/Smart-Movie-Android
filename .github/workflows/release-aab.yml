name: Android release AAB

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    name: Signed mobile, TV and Wear bundles
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - uses: actions/checkout@v7
      - name: Verify release train and vendored contract
        env:
          REQUIRE_UPSTREAM_COMMIT: "1"
        run: ./scripts/verify-release.sh mobile
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/smartmovie-release.jks"
      - name: Build signed AABs
        env:
          SMARTMOVIE_KEYSTORE_PATH: ${{ runner.temp }}/smartmovie-release.jks
          SMARTMOVIE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SMARTMOVIE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SMARTMOVIE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --dependency-verification=strict :app:bundleRelease :wear:bundleRelease
      - name: Verify both bundles use the same signing certificate
        run: |
          set -euo pipefail
          app_bundle=app/build/outputs/bundle/release/app-release.aab
          wear_bundle=wear/build/outputs/bundle/release/wear-release.aab
          jarsigner -verify "$app_bundle"
          jarsigner -verify "$wear_bundle"
          app_certificate="$(keytool -printcert -jarfile "$app_bundle" | awk -F': ' '/SHA256:/ { print $2; exit }')"
          wear_certificate="$(keytool -printcert -jarfile "$wear_bundle" | awk -F': ' '/SHA256:/ { print $2; exit }')"
          if [[ -z "$app_certificate" || "$app_certificate" != "$wear_certificate" ]]; then
            echo "Main and Wear bundles are not signed by the same certificate." >&2
            exit 1
          fi
      - name: Upload phone, tablet, ChromeOS, TV and XR AAB
        uses: actions/upload-artifact@v7
        with:
          name: smartmovie-2.0.0-aab
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
      - name: Upload Wear OS companion AAB
        uses: actions/upload-artifact@v7
        with:
          name: smartmovie-wear-2.0.0-aab
          path: wear/build/outputs/bundle/release/wear-release.aab
          if-no-files-found: error
          retention-days: 14
