name: Compose Multiplatform release artifacts

on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: multiplatform

jobs:
  verify:
    name: Verify KMP release train and contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - run: ./scripts/verify-release.sh kmp
        working-directory: ${{ github.workspace }}
        env:
          REQUIRE_UPSTREAM_COMMIT: "1"

  web:
    name: Web Wasm and JavaScript bundles
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Build browser distributions
        run: ./gradlew --dependency-verification=strict :composeApp:wasmJsBrowserDistribution :composeApp:jsBrowserDistribution
      - uses: actions/upload-artifact@v7
        with:
          name: smartmovie-web-2.0.0
          path: |
            multiplatform/composeApp/build/dist/wasmJs/productionExecutable/
            multiplatform/composeApp/build/dist/js/productionExecutable/
          if-no-files-found: error
          retention-days: 14

  desktop:
    name: Desktop application image (${{ matrix.os }})
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Build portable application image
        run: ./gradlew --dependency-verification=strict :composeApp:createDistributable
      - uses: actions/upload-artifact@v7
        with:
          name: smartmovie-${{ runner.os }}-2.0.0
          path: multiplatform/composeApp/build/compose/binaries/main/app/
          if-no-files-found: error
          retention-days: 14
